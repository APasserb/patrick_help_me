<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lucky Lobby</title>
	<style>
		:root { --bg: #0b080b; --panel: #21151b; --gold: #f6c75c; --bright: #ffe49a; --red: #e6444d; --cream: #fff5dc; --muted: #b89e91; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; color: var(--cream); background: radial-gradient(circle at 50% -10%, #84213066, transparent 35rem), radial-gradient(circle at 8% 90%, #bc84261a, transparent 24rem), var(--bg); font-family: Georgia, "Times New Roman", serif; }
		button, input { font: inherit; } button { cursor: pointer; }
		.app { width: min(1050px, calc(100% - 32px)); min-height: 100vh; margin: auto; padding: 30px 0 50px; }
		.site-header { text-align: center; } .kicker { margin: 0 0 8px; color: var(--gold); font: 700 11px "Trebuchet MS", sans-serif; letter-spacing: .28em; text-transform: uppercase; }
		h1 { margin: 0; color: var(--bright); font-size: clamp(42px, 8vw, 82px); letter-spacing: .05em; line-height: .95; text-shadow: 0 0 18px #f6c75c40, 0 4px 0 #6f3a20; }
		.balance { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; padding: 10px 20px; border: 1px solid #f6c75c8c; background: #261719e6; box-shadow: 0 0 24px #f6c75c1a; font: 700 18px "Trebuchet MS", sans-serif; }
		.chip { color: var(--gold); font-size: 23px; } #balance { color: var(--bright); }
		nav { display: flex; justify-content: center; gap: 8px; margin: 32px 0 22px; padding: 6px; border: 1px solid #f6c75c40; background: #1e1115dc; }
		.nav-button { min-width: 150px; padding: 12px 22px; color: var(--muted); border: 1px solid transparent; background: transparent; font: 700 12px "Trebuchet MS", sans-serif; letter-spacing: .12em; text-transform: uppercase; transition: 160ms ease; }
		.nav-button:hover, .nav-button.active { color: var(--bright); border-color: #f6c75c99; background: linear-gradient(#4a2528, #2b171d); }
		.game { display: none; min-height: 480px; padding: clamp(20px, 5vw, 48px); border: 1px solid #f6c75c66; background: linear-gradient(145deg, #2c191ef5, #140d11f7); box-shadow: inset 0 0 50px #00000059, 0 18px 70px #00000059; text-align: center; }
		.game.active { display: block; animation: enter 400ms ease both; } .game h2 { margin: 0 0 8px; color: var(--bright); font-size: clamp(28px, 5vw, 42px); }
		.game-intro { margin: 0 auto 28px; color: var(--muted); font: 14px/1.5 "Trebuchet MS", sans-serif; }
		.reels { display: flex; justify-content: center; gap: clamp(8px, 3vw, 18px); margin: 30px 0; }
		.reel { display: grid; place-items: center; width: clamp(80px, 18vw, 130px); height: clamp(100px, 22vw, 150px); border: 4px solid var(--gold); border-radius: 8px; background: linear-gradient(135deg, #fff2c9, #c8913d 42%, #fff0bd 70%, #98602a); box-shadow: 0 0 0 4px #422326, 0 0 26px #f6c75c4d; font-size: clamp(42px, 10vw, 70px); }
		.reel.spinning { animation: shake 120ms linear infinite; }
		.controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: end; gap: 12px; } .field { display: grid; gap: 6px; color: var(--muted); font: 11px "Trebuchet MS", sans-serif; letter-spacing: .1em; text-align: left; text-transform: uppercase; }
		input[type="number"] { width: 130px; padding: 12px; color: var(--cream); border: 1px solid #f6c75c80; background: #130c10; outline: none; font: 700 16px "Trebuchet MS", sans-serif; } input:focus { border-color: var(--bright); box-shadow: 0 0 0 2px #f6c75c26; }
		.action-button, .reset-button { padding: 13px 28px; color: #27130f; border: 1px solid var(--bright); background: linear-gradient(#ffe59b, #d59435); box-shadow: 0 0 18px #f6c75c38, inset 0 1px #ffffffa6; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; transition: 160ms ease; }
		.action-button:hover, .reset-button:hover { transform: translateY(-2px); box-shadow: 0 5px 26px #f6c75c61; } .action-button:disabled { cursor: wait; opacity: .55; transform: none; }
		.result { min-height: 26px; margin: 22px 0 0; color: var(--bright); font: 700 15px "Trebuchet MS", sans-serif; } .result.loss { color: #f0807a; }
		.coin-stage { display: grid; place-items: center; min-height: 190px; margin: 5px 0 18px; perspective: 900px; }
		.coin { position: relative; width: 132px; height: 132px; border: 8px solid #b8792d; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff2a8, #e2a63f 48%, #8a4b22); box-shadow: 0 0 0 5px #572c20, 0 0 32px #f6c75c73; transform-style: preserve-3d; }
		.coin::before, .coin::after { position: absolute; inset: 0; display: grid; place-items: center; backface-visibility: hidden; color: #75401e; content: "HEADS"; font: 700 20px Georgia, serif; } .coin::after { content: "TAILS"; transform: rotateY(180deg); } .coin.flipping { animation: flip 900ms ease-in-out; }
		.choice-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; } .choice { padding: 10px 20px; color: var(--muted); border: 1px solid #f6c75c59; background: transparent; font: 700 12px "Trebuchet MS", sans-serif; letter-spacing: .1em; } .choice:hover, .choice.selected { color: var(--bright); border-color: var(--gold); background: #f6c75c1f; }
		.game-over { display: none; padding: 32px; border: 1px solid var(--red); background: #52151ded; text-align: center; } .game-over.visible { display: block; animation: enter 300ms ease both; } .game-over h2 { margin: 0 0 8px; color: #ffb096; font-size: 30px; } .game-over p { margin: 0 0 20px; color: #f5c4b0; font: 14px "Trebuchet MS", sans-serif; }
		@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } } @keyframes shake { 0%, 100% { transform: translateX(-2px); } 50% { transform: translateX(2px); } } @keyframes flip { from { transform: rotateY(0); } to { transform: rotateY(1800deg); } }
		@media (max-width: 560px) { .app { width: min(100% - 20px, 500px); padding-top: 20px; } nav { margin-top: 24px; } .nav-button { min-width: 0; flex: 1; padding: 11px 7px; font-size: 10px; } .game { min-height: 500px; padding: 28px 14px; } .controls { align-items: stretch; flex-direction: column; margin: auto; width: min(100%, 260px); } .field input, .action-button { width: 100%; } }
	</style>
</head>
<body>
	<main class="app">
		<header class="site-header"><p class="kicker">The house is open</p><h1>Lucky Lobby</h1><div class="balance" aria-live="polite"><span class="chip">◆</span><span><span id="balance">1000</span> chips</span></div></header>
		<nav aria-label="Choose a game"><button class="nav-button active" data-game="slots" type="button">Slot Machine</button><button class="nav-button" data-game="coinflip" type="button">Coin Flip</button></nav>
		<section class="game active" id="slots" aria-labelledby="slots-title"><h2 id="slots-title">Golden Reels</h2><p class="game-intro">Line up three symbols for the biggest prize.</p><div class="reels" aria-live="polite"><div class="reel" id="reelOne">🍒</div><div class="reel" id="reelTwo">🔔</div><div class="reel" id="reelThree">7️⃣</div></div><div class="controls"><label class="field">Bet amount <input id="slotBet" type="number" min="1" step="1" value="50"></label><button class="action-button" id="spinButton" type="button">Spin</button></div><p class="result" id="slotResult" aria-live="polite">Good luck.</p></section>
		<section class="game" id="coinflip" aria-labelledby="coin-title"><h2 id="coin-title">House Coin</h2><p class="game-intro">Call it right and double your wager.</p><div class="coin-stage"><div class="coin" id="coin" aria-label="Coin waiting to flip"></div></div><div class="choice-row"><button class="choice selected" data-choice="heads" type="button">Heads</button><button class="choice" data-choice="tails" type="button">Tails</button></div><div class="controls"><label class="field">Bet amount <input id="coinBet" type="number" min="1" step="1" value="50"></label><button class="action-button" id="flipButton" type="button">Flip coin</button></div><p class="result" id="coinResult" aria-live="polite">Make your call.</p></section>
		<section class="game-over" id="gameOver" aria-live="assertive"><h2>Table closed</h2><p>Your chips are gone. Reset your balance to play another round.</p><button class="reset-button" id="resetButton" type="button">Reset to 1000 chips</button></section>
	</main>
	<script>
		const STARTING_BALANCE = 1000;
		const symbols = ["🍒", "🔔", "7️⃣", "💎", "🍫"];
		let balance = STARTING_BALANCE;
		let coinChoice = "heads";
		let busy = false;
		const balanceDisplay = document.querySelector("#balance");
		const gameOver = document.querySelector("#gameOver");
		function validBet(input) { const amount = Math.floor(Number(input.value)); return Number.isFinite(amount) && amount > 0 && amount <= balance ? amount : null; }
		function setBalance(nextBalance) { balance = nextBalance; balanceDisplay.textContent = balance; gameOver.classList.toggle("visible", balance === 0); }
		function showResult(element, message, isLoss = false) { element.textContent = message; element.classList.toggle("loss", isLoss); }
		document.querySelectorAll(".nav-button").forEach((button) => button.addEventListener("click", () => { document.querySelectorAll(".nav-button").forEach((item) => item.classList.remove("active")); document.querySelectorAll(".game").forEach((game) => game.classList.remove("active")); button.classList.add("active"); document.querySelector(`#${button.dataset.game}`).classList.add("active"); }));
		document.querySelectorAll(".choice").forEach((button) => button.addEventListener("click", () => { coinChoice = button.dataset.choice; document.querySelectorAll(".choice").forEach((item) => item.classList.toggle("selected", item === button)); }));
		document.querySelector("#spinButton").addEventListener("click", () => { if (busy) return; const bet = validBet(document.querySelector("#slotBet")); const result = document.querySelector("#slotResult"); if (!bet) { showResult(result, "Enter a bet within your balance.", true); return; } busy = true; setBalance(balance - bet); const reels = [document.querySelector("#reelOne"), document.querySelector("#reelTwo"), document.querySelector("#reelThree")]; reels.forEach((reel) => reel.classList.add("spinning")); showResult(result, "The reels are turning..."); setTimeout(() => { const outcome = reels.map(() => symbols[Math.floor(Math.random() * symbols.length)]); reels.forEach((reel, index) => { reel.textContent = outcome[index]; reel.classList.remove("spinning"); }); const matches = outcome.filter((symbol) => symbol === outcome[0]).length; const payout = matches === 3 ? bet * 5 : matches === 2 ? bet : 0; setBalance(balance + payout); showResult(result, payout ? `${matches === 3 ? "Jackpot!" : "Pair!"} You won ${payout} chips.` : "No match. The house wins.", !payout); busy = false; }, 950); });
		document.querySelector("#flipButton").addEventListener("click", () => { if (busy) return; const bet = validBet(document.querySelector("#coinBet")); const result = document.querySelector("#coinResult"); if (!bet) { showResult(result, "Enter a bet within your balance.", true); return; } busy = true; setBalance(balance - bet); const coin = document.querySelector("#coin"); coin.classList.remove("flipping"); void coin.offsetWidth; coin.classList.add("flipping"); showResult(result, "The coin is in the air..."); setTimeout(() => { const outcome = Math.random() < 0.5 ? "heads" : "tails"; coin.style.transform = outcome === "heads" ? "rotateY(0)" : "rotateY(180deg)"; const won = outcome === coinChoice; setBalance(balance + (won ? bet * 2 : 0)); showResult(result, won ? `It was ${outcome}. You won ${bet * 2} chips.` : `It was ${outcome}. Your bet is lost.`, !won); busy = false; }, 950); });
		document.querySelector("#resetButton").addEventListener("click", () => { setBalance(STARTING_BALANCE); document.querySelector("#slotResult").textContent = "Good luck."; document.querySelector("#coinResult").textContent = "Make your call."; });
	</script>
</body>
</html>
